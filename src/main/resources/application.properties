spring.application.name=CampusEats

# ---------- Base de datos H2 en memoria (se borra al reiniciar) ----------
spring.datasource.url=jdbc:h2:mem:campuseats
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
# Consola: http://localhost:8080/h2-console  (JDBC URL: jdbc:h2:mem:campuseats, user: sa, sin clave)
spring.h2.console.enabled=true

# ---------- Fechas ZonedDateTime en hora de Lima (-05:00) ----------
spring.jackson.time-zone=America/Lima

# ---------- JWT ----------
# El secreto debe tener al menos 32 caracteres (256 bits) para HS256
jwt.secret=campuseats-secreto-super-largo-1234567890-abcdef
# 3600000 ms = 1 hora (el login responde expiresIn: 3600)
jwt.expiration-access=3600000
